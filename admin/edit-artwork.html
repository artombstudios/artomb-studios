<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f7f4ee"
    >

    <title>Edit Artwork — Artomb Studios</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f7f4ee;
            --card: #fffdf9;
            --text: #171717;
            --muted: #77736c;
            --border: rgba(23, 23, 23, .11);
            --danger: #9b3d3d;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .admin-header {
            position: sticky;
            top: 0;
            z-index: 50;

            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5vw;

            background: rgba(247, 244, 238, .94);

            border-bottom:
                1px solid var(--border);

            backdrop-filter: blur(12px);
        }

        .brand {
            text-decoration: none;
            color: var(--text);
            line-height: 1;
        }

        .brand-main {
            display: block;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 21px;
            letter-spacing: 3px;
        }

        .brand-sub {
            display: block;

            margin-top: 4px;

            font-size: 7px;
            letter-spacing: 4px;

            opacity: .55;
        }

        .back-button {
            color: var(--text);
            text-decoration: none;

            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;

            padding: 11px 14px;

            border: 1px solid var(--border);

            transition:
                background .2s ease,
                border-color .2s ease;
        }

        .back-button:hover {
            background: var(--card);
            border-color: rgba(23, 23, 23, .3);
        }

        .page {
            width: min(850px, 90%);

            margin: 0 auto;

            padding: 70px 0 90px;
        }

        .intro {
            margin-bottom: 40px;
        }

        .eyebrow {
            margin-bottom: 14px;

            color: var(--muted);

            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(42px, 7vw, 68px);

            font-weight: 400;

            line-height: .98;

            letter-spacing: -2px;
        }

        .intro-text {
            max-width: 550px;

            margin-top: 20px;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.7;
        }

        .form-card {
            background: var(--card);

            border:
                1px solid var(--border);
        }

        .form-section {
            padding: 30px;

            border-bottom:
                1px solid var(--border);
        }

        .form-section:last-child {
            border-bottom: 0;
        }

        .section-title {
            margin-bottom: 25px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 25px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;

            margin-bottom: 9px;

            color: var(--muted);

            font-size: 10px;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        input,
        textarea,
        select {
            width: 100%;

            padding: 14px 15px;

            background: #fff;

            color: var(--text);

            border:
                1px solid var(--border);

            outline: none;

            border-radius: 0;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color:
                rgba(23, 23, 23, .4);

            box-shadow:
                0 0 0 3px rgba(23, 23, 23, .04);
        }

        textarea {
            min-height: 150px;

            resize: vertical;

            line-height: 1.6;
        }

        .image-preview {
            display: none;

            margin-top: 18px;

            border:
                1px solid var(--border);

            background: #eeeae2;
        }

        .image-preview img {
            width: 100%;

            max-height: 420px;

            display: block;

            object-fit: contain;
        }

        .image-preview.show {
            display: block;
        }

        .featured-row {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding: 18px;

            border:
                1px solid var(--border);

            background: #fff;
        }

        .featured-info h3 {
            margin-bottom: 5px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 18px;
            font-weight: 400;
        }

        .featured-info p {
            color: var(--muted);

            font-size: 12px;
            line-height: 1.5;
        }

        .toggle {
            position: relative;

            width: 50px;
            height: 28px;

            flex-shrink: 0;
        }

        .toggle input {
            width: 0;
            height: 0;

            opacity: 0;
        }

        .toggle-slider {
            position: absolute;
            inset: 0;

            background: #ddd8cf;

            cursor: pointer;

            transition:
                background .25s ease;
        }

        .toggle-slider::before {
            content: "";

            position: absolute;

            width: 20px;
            height: 20px;

            left: 4px;
            top: 4px;

            background: white;

            transition:
                transform .25s ease;
        }

        .toggle input:checked + .toggle-slider {
            background: var(--text);
        }

        .toggle input:checked + .toggle-slider::before {
            transform: translateX(22px);
        }

        .actions {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }

        .cancel-button,
        .save-button {
            padding: 14px 20px;

            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .cancel-button {
            color: var(--text);

            background: transparent;

            border:
                1px solid var(--border);

            text-decoration: none;
        }

        .save-button {
            min-width: 150px;

            background: var(--text);
            color: white;

            border: 0;
        }

        .save-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-bottom: 25px;

            padding: 14px;

            font-size: 12px;

            line-height: 1.5;
        }

        .message.error {
            display: block;

            background: #fff4f4;

            border:
                1px solid #e1bebe;

            color: var(--danger);
        }

        .message.success {
            display: block;

            background: #f2f7f2;

            border:
                1px solid #bfd1bf;

            color: #416341;
        }

        .loading {
            padding: 30px;

            text-align: center;

            color: var(--muted);

            font-size: 13px;
        }

        .admin-footer {
            width: min(850px, 90%);

            margin: 0 auto;

            padding: 25px 0 35px;

            border-top:
                1px solid var(--border);

            display: flex;

            justify-content: space-between;

            gap: 20px;

            color: var(--muted);

            font-size: 10px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {

            .admin-header {
                height: 65px;

                padding: 0 5%;
            }

            .page {
                width: 90%;

                padding-top: 50px;
            }

            h1 {
                font-size: 45px;

                letter-spacing: -1.5px;
            }

            .form-section {
                padding: 22px;
            }

            .actions {
                flex-direction: column-reverse;
                align-items: stretch;
            }

            .cancel-button,
            .save-button {
                width: 100%;

                text-align: center;
            }

            .admin-footer {
                flex-direction: column;
            }
        }

    </style>
</head>

<body>

<header class="admin-header">

    <a
        href="dashboard.html"
        class="brand">

        <span class="brand-main">
            ARTOMB
        </span>

        <span class="brand-sub">
            STUDIOS
        </span>

    </a>

    <a
        href="dashboard.html"
        class="back-button">

        ← Dashboard

    </a>

</header>


<main class="page">

    <section class="intro">

        <p class="eyebrow">
            Artwork Management
        </p>

        <h1>
            Edit<br>
            artwork.
        </h1>

        <p class="intro-text">
            Update the details of your artwork
            and save the changes directly to
            your Artomb Studios collection.
        </p>

    </section>


    <div
        class="message"
        id="message">
    </div>


    <div
        class="form-card"
        id="formCard">

        <div class="loading">
            Loading artwork...
        </div>

    </div>

</main>


<footer class="admin-footer">

    <span>
        © 2026 Artomb Studios
    </span>

    <span>
        Private Studio Dashboard
    </span>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    const SUPABASE_URL =
        "https://pdopupcnmvjzombukcpi.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_AbIdZemk0Mq7f1jNNM5zdQ_pYIzZNlU";


    const {
        createClient
    } = supabase;


    const supabaseClient =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    const formCard =
        document.getElementById(
            "formCard"
        );


    const message =
        document.getElementById(
            "message"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const artworkId =
        params.get("id");


    function escapeHtml(value) {

        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    function showMessage(
        text,
        type
    ) {

        message.textContent = text;

        message.className =
            "message " + type;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    async function checkLogin() {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            showMessage(
                "Unable to check login session.",
                "error"
            );

            return false;
        }


        if (!data.session) {

            window.location.href =
                "login.html";

            return false;
        }


        return true;
    }


    async function loadArtwork() {

        if (!artworkId) {

            showMessage(
                "No artwork was selected. Please return to the dashboard and choose an artwork to edit.",
                "error"
            );

            formCard.innerHTML = `
                <div class="loading">
                    Artwork ID is missing.
                </div>
            `;

            return;
        }


        const {
            data,
            error
        } =
            await supabaseClient
                .from("artworks")
                .select("*")
                .eq(
                    "id",
                    artworkId
                )
                .single();


        if (error) {

            console.error(error);

            showMessage(
                "Could not load artwork: " +
                error.message,
                "error"
            );

            formCard.innerHTML = `
                <div class="loading">
                    Unable to load artwork.
                </div>
            `;

            return;
        }


        renderForm(data);
    }


    function renderForm(artwork) {

        formCard.innerHTML = `

            <form id="editForm">

                <div class="form-section">

                    <h2 class="section-title">
                        Artwork Details
                    </h2>


                    <div class="form-group">

                        <label for="title">
                            Artwork Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            value="${escapeHtml(
                                artwork.title || ""
                            )}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <input
                            type="text"
                            id="category"
                            name="category"
                            value="${escapeHtml(
                                artwork.category || ""
                            )}"
                            placeholder="e.g. Charcoal, Graphite, Portrait"
                        >

                    </div>


                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            placeholder="Write something about this artwork..."
                        >${escapeHtml(
                            artwork.description || ""
                        )}</textarea>

                    </div>

                </div>


                <div class="form-section">

                    <h2 class="section-title">
                        Artwork Image
                    </h2>


                    <div class="form-group">

                        <label for="imageUrl">
                            Image URL
                        </label>

                        <input
                            type="url"
                            id="imageUrl"
                            name="imageUrl"
                            value="${escapeHtml(
                                artwork.image_url || ""
                            )}"
                            placeholder="https://..."
                        >

                        <div
                            class="image-preview"
                            id="imagePreview">

                            <img
                                id="previewImage"
                                src=""
                                alt="Artwork preview"
                            >

                        </div>

                    </div>

                </div>


                <div class="form-section">

                    <h2 class="section-title">
                        Publishing
                    </h2>


                    <div class="featured-row">

                        <div class="featured-info">

                            <h3>
                                Featured Artwork
                            </h3>

                            <p>
                                Show this artwork in
                                your featured collection.
                            </p>

                        </div>


                        <label class="toggle">

                            <input
                                type="checkbox"
                                id="featured"
                                ${
                                    artwork.featured
                                    ? "checked"
                                    : ""
                                }
                            >

                            <span
                                class="toggle-slider">
                            </span>

                        </label>

                    </div>

                </div>


                <div class="form-section">

                    <div class="actions">

                        <a
                            href="dashboard.html"
                            class="cancel-button">

                            Cancel

                        </a>


                        <button
                            type="submit"
                            class="save-button"
                            id="saveButton">

                            Save Changes

                        </button>

                    </div>

                </div>

            </form>
        `;


        setupPreview();


        document
            .getElementById("editForm")
            .addEventListener(
                "submit",
                saveArtwork
            );
    }


    function setupPreview() {

        const imageUrl =
            document.getElementById(
                "imageUrl"
            );

        const preview =
            document.getElementById(
                "imagePreview"
            );

        const previewImage =
            document.getElementById(
                "previewImage"
            );


        function updatePreview() {

            const url =
                imageUrl.value.trim();


            if (!url) {

                preview.classList.remove(
                    "show"
                );

                previewImage.removeAttribute(
                    "src"
                );

                return;
            }


            previewImage.src = url;

            preview.classList.add(
                "show"
            );
        }


        imageUrl.addEventListener(
            "input",
            updatePreview
        );


        previewImage.addEventListener(
            "error",
            function () {

                preview.classList.remove(
                    "show"
                );
            }
        );


        updatePreview();
    }


    async function saveArtwork(event) {

        event.preventDefault();


        const saveButton =
            document.getElementById(
                "saveButton"
            );


        saveButton.disabled = true;

        saveButton.textContent =
            "Saving...";


        const title =
            document.getElementById(
                "title"
            ).value.trim();


        const category =
            document.getElementById(
                "category"
            ).value.trim();


        const description =
            document.getElementById(
                "description"
            ).value.trim();


        const imageUrl =
            document.getElementById(
                "imageUrl"
            ).value.trim();


        const featured =
            document.getElementById(
                "featured"
            ).checked;


        const {
            error
        } =
            await supabaseClient
                .from("artworks")
                .update({
                    title: title,
                    category: category,
                    description: description,
                    image_url: imageUrl,
                    featured: featured
                })
                .eq(
                    "id",
                    artworkId
                );


        if (error) {

            console.error(error);

            saveButton.disabled = false;

            saveButton.textContent =
                "Save Changes";

            showMessage(
                "Could not save changes: " +
                error.message,
                "error"
            );

            return;
        }


        showMessage(
            "Artwork updated successfully.",
            "success"
        );


        saveButton.textContent =
            "Saved ✓";


        setTimeout(
            function () {

                window.location.href =
                    "dashboard.html";

            },
            900
        );
    }


    async function start() {

        const loggedIn =
            await checkLogin();


        if (!loggedIn) {
            return;
        }


        await loadArtwork();
    }


    start();

</script>

</body>
</html>
