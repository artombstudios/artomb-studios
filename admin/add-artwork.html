<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f7f4ee"
    >

    <title>Add Artwork — Artomb Studios</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f7f4ee;
            --card: #fffdf9;
            --text: #171717;
            --muted: #77736c;
            --border: rgba(23, 23, 23, .12);
            --success-bg: #f3faf4;
            --success-border: #b8d2bd;
            --success-text: #38603e;
            --error-bg: #fff4f4;
            --error-border: #e1bebe;
            --error-text: #9b3d3d;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5vw;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(247, 244, 238, .95);

            position: sticky;
            top: 0;
            z-index: 10;

            backdrop-filter: blur(12px);
        }

        .brand-main {
            display: block;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 21px;
            letter-spacing: 3px;
        }

        .brand-sub {
            display: block;

            margin-top: 4px;

            font-size: 7px;
            letter-spacing: 4px;

            opacity: .55;
        }

        .back-link {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;

            color: var(--muted);
        }

        /* =========================
           MAIN
        ========================= */

        .page {
            width: min(1100px, 90%);

            margin: auto;

            padding:
                65px 0 90px;
        }

        .intro {
            margin-bottom: 40px;
        }

        .eyebrow {
            margin-bottom: 14px;

            color: var(--muted);

            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(42px, 7vw, 68px);

            font-weight: 400;

            line-height: .98;

            letter-spacing: -2px;
        }

        .intro p:last-child {
            max-width: 520px;

            margin-top: 18px;

            color: var(--muted);

            font-size: 14px;

            line-height: 1.7;
        }

        /* =========================
           FORM
        ========================= */

        .form-layout {
            display: grid;

            grid-template-columns:
                1.1fr .9fr;

            gap: 25px;
        }

        .card {
            background: var(--card);

            border:
                1px solid var(--border);

            padding: 28px;
        }

        .card-title {
            margin-bottom: 25px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 25px;

            font-weight: 400;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;

            margin-bottom: 9px;

            font-size: 10px;

            letter-spacing: 1.8px;

            text-transform: uppercase;

            color: #555;
        }

        input,
        textarea,
        select {
            width: 100%;

            border:
                1px solid #d8d4cc;

            background: #f7f4ee;

            color: var(--text);

            outline: none;

            padding: 14px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        input {
            height: 50px;
        }

        textarea {
            min-height: 135px;

            resize: vertical;

            line-height: 1.6;
        }

        select {
            height: 50px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #171717;

            box-shadow:
                0 0 0 3px
                rgba(23, 23, 23, .05);
        }

        /* =========================
           IMAGE UPLOAD
        ========================= */

        .upload-box {
            min-height: 250px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            border:
                1px dashed #bcb8b0;

            background: #f7f4ee;

            padding: 25px;

            cursor: pointer;

            transition:
                border-color .2s ease,
                background .2s ease;
        }

        .upload-box:hover {
            border-color: #171717;

            background: #f3efe8;
        }

        .upload-icon {
            width: 52px;
            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid var(--border);

            margin-bottom: 18px;

            font-size: 23px;
        }

        .upload-box strong {
            display: block;

            margin-bottom: 7px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 20px;

            font-weight: 400;
        }

        .upload-box span {
            color: var(--muted);

            font-size: 11px;

            line-height: 1.6;
        }

        #artworkImage {
            display: none;
        }

        .preview {
            display: none;

            width: 100%;

            margin-top: 15px;
        }

        .preview img {
            display: block;

            width: 100%;

            max-height: 360px;

            object-fit: contain;

            background: #eeeae2;
        }

        .file-name {
            margin-top: 10px;

            color: var(--muted);

            font-size: 11px;

            line-height: 1.5;

            word-break: break-word;
        }

        /* =========================
           STATUS
        ========================= */

        .status-options {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;
        }

        .status-option {
            position: relative;
        }

        .status-option input {
            position: absolute;

            opacity: 0;

            pointer-events: none;
        }

        .status-option label {
            height: 50px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0;

            border:
                1px solid #d8d4cc;

            cursor: pointer;

            color: var(--muted);

            transition:
                background .2s ease,
                color .2s ease,
                border-color .2s ease;
        }

        .status-option input:checked + label {
            background: var(--text);

            color: white;

            border-color: var(--text);
        }

        /* =========================
           ACTIONS
        ========================= */

        .actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 25px;
        }

        .button {
            min-height: 50px;

            padding: 0 22px;

            border:
                1px solid var(--text);

            font-size: 10px;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            cursor: pointer;
        }

        .button-secondary {
            background: transparent;

            color: var(--text);
        }

        .button-primary {
            background: var(--text);

            color: white;
        }

        .button-primary:disabled {
            opacity: .55;

            cursor: not-allowed;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;

            margin-top: 20px;

            padding: 14px;

            font-size: 12px;

            line-height: 1.5;
        }

        .message.success {
            border:
                1px solid var(--success-border);

            background:
                var(--success-bg);

            color:
                var(--success-text);
        }

        .message.error {
            border:
                1px solid var(--error-border);

            background:
                var(--error-bg);

            color:
                var(--error-text);
        }

        /* =========================
           LOADING
        ========================= */

        .loading-overlay {
            display: none;

            position: fixed;

            inset: 0;

            z-index: 100;

            background:
                rgba(247, 244, 238, .88);

            backdrop-filter: blur(8px);

            align-items: center;

            justify-content: center;

            text-align: center;
        }

        .loading-box {
            width: min(330px, 85%);

            padding: 30px;

            background: var(--card);

            border:
                1px solid var(--border);
        }

        .spinner {
            width: 35px;
            height: 35px;

            margin: 0 auto 18px;

            border:
                2px solid #ddd8cf;

            border-top-color:
                #171717;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-title {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 20px;

            margin-bottom: 8px;
        }

        .loading-text {
            color: var(--muted);

            font-size: 12px;

            line-height: 1.6;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 760px) {

            .header {
                height: 65px;
            }

            .page {
                padding-top: 50px;
            }

            .form-layout {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 22px;
            }

            .actions {
                flex-direction: column-reverse;
            }

            .button {
                width: 100%;
            }
        }

        @media (max-width: 420px) {

            .back-link {
                font-size: 9px;
            }

            h1 {
                font-size: 43px;
            }

            .status-options {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <a
        href="dashboard.html"
        aria-label="Back to dashboard"
    >

        <span class="brand-main">
            ARTOMB
        </span>

        <span class="brand-sub">
            STUDIOS
        </span>

    </a>


    <a
        href="dashboard.html"
        class="back-link"
    >

        ← Dashboard

    </a>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="page">


    <section class="intro">

        <p class="eyebrow">
            Studio Collection
        </p>

        <h1>
            Add new<br>
            artwork.
        </h1>

        <p>
            Add your artwork details and upload the
            artwork image. Once saved, it will be
            stored in your Artomb Studios collection.
        </p>

    </section>



    <!-- =========================
         FORM
    ========================= -->

    <form id="artworkForm">


        <div class="form-layout">


            <!-- =========================
                 LEFT CARD
            ========================= -->

            <section class="card">

                <h2 class="card-title">
                    Artwork Details
                </h2>


                <!-- TITLE -->

                <div class="field">

                    <label for="title">
                        Artwork Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="e.g. Silent Expression"
                        required
                    >

                </div>



                <!-- MEDIUM -->

                <div class="field">

                    <label for="medium">
                        Medium
                    </label>

                    <input
                        type="text"
                        id="medium"
                        placeholder="e.g. Graphite"
                        required
                    >

                </div>



                <!-- CATEGORY -->

                <div class="field">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        required
                    >

                        <option value="">
                            Select category
                        </option>

                        <option value="portrait">
                            Portrait
                        </option>

                        <option value="charcoal">
                            Charcoal
                        </option>

                        <option value="graphite">
                            Graphite
                        </option>

                        <option value="couple">
                            Couple Portrait
                        </option>

                        <option value="pet">
                            Pet Portrait
                        </option>

                        <option value="custom">
                            Custom Artwork
                        </option>

                    </select>

                </div>



                <!-- PRICE -->

                <div class="field">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        placeholder="Optional"
                    >

                </div>



                <!-- DESCRIPTION -->

                <div class="field">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Tell the story behind this artwork..."
                    ></textarea>

                </div>



                <!-- STATUS -->

                <div class="field">

                    <label>
                        Publication Status
                    </label>


                    <div class="status-options">


                        <div class="status-option">

                            <input
                                type="radio"
                                id="published"
                                name="status"
                                value="published"
                                checked
                            >

                            <label for="published">
                                Published
                            </label>

                        </div>



                        <div class="status-option">

                            <input
                                type="radio"
                                id="draft"
                                name="status"
                                value="draft"
                            >

                            <label for="draft">
                                Draft
                            </label>

                        </div>


                    </div>

                </div>

            </section>



            <!-- =========================
                 RIGHT CARD
            ========================= -->

            <section class="card">

                <h2 class="card-title">
                    Artwork Image
                </h2>


                <label
                    for="artworkImage"
                    class="upload-box"
                    id="uploadBox"
                >

                    <div class="upload-icon">
                        +
                    </div>

                    <strong>
                        Choose artwork
                    </strong>

                    <span>
                        JPG, PNG or WEBP<br>
                        Maximum recommended size: 10 MB
                    </span>

                </label>



                <input
                    type="file"
                    id="artworkImage"
                    accept="image/jpeg,image/png,image/webp"
                >



                <div
                    class="preview"
                    id="preview"
                >

                    <img
                        id="previewImage"
                        alt="Artwork preview"
                    >

                    <div
                        class="file-name"
                        id="fileName"
                    ></div>

                </div>



                <div
                    class="message"
                    id="message"
                ></div>

            </section>


        </div>



        <!-- ACTIONS -->

        <div class="actions">

            <button
                type="button"
                class="button button-secondary"
                id="cancelButton"
            >

                Cancel

            </button>


            <button
                type="submit"
                class="button button-primary"
                id="saveButton"
            >

                Save Artwork

            </button>

        </div>


    </form>

</main>



<!-- =========================
     LOADING OVERLAY
========================= -->

<div
    class="loading-overlay"
    id="loadingOverlay"
>

    <div class="loading-box">

        <div class="spinner"></div>

        <div
            class="loading-title"
            id="loadingTitle"
        >
            Saving artwork
        </div>

        <div
            class="loading-text"
            id="loadingText"
        >
            Please wait while your artwork is uploaded.
        </div>

    </div>

</div>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    /* =========================================
       SUPABASE CONFIG
    ========================================= */

    const SUPABASE_URL =
        "https://pdopupcnmvjzombukcpi.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_AbIdZemk0Mq7f1jNNM5zdQ_pYIzZNlU";


    const {
        createClient
    } = supabase;


    const supabaseClient =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );



    /* =========================================
       ELEMENTS
    ========================================= */

    const form =
        document.getElementById(
            "artworkForm"
        );


    const imageInput =
        document.getElementById(
            "artworkImage"
        );


    const preview =
        document.getElementById(
            "preview"
        );


    const previewImage =
        document.getElementById(
            "previewImage"
        );


    const fileName =
        document.getElementById(
            "fileName"
        );


    const message =
        document.getElementById(
            "message"
        );


    const cancelButton =
        document.getElementById(
            "cancelButton"
        );


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    const loadingOverlay =
        document.getElementById(
            "loadingOverlay"
        );


    const loadingTitle =
        document.getElementById(
            "loadingTitle"
        );


    const loadingText =
        document.getElementById(
            "loadingText"
        );



    /* =========================================
       CONSTANTS
    ========================================= */

    const BUCKET_NAME =
        "artworks";


    const MAX_FILE_SIZE =
        10 * 1024 * 1024;


    const ALLOWED_TYPES = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];



    /* =========================================
       MESSAGE
    ========================================= */

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;

        message.style.display =
            "block";

    }


    function hideMessage() {

        message.style.display =
            "none";

        message.textContent =
            "";

    }



    /* =========================================
       LOADING
    ========================================= */

    function showLoading(
        title,
        text
    ) {

        loadingTitle.textContent =
            title;

        loadingText.textContent =
            text;

        loadingOverlay.style.display =
            "flex";

        saveButton.disabled =
            true;

    }


    function hideLoading() {

        loadingOverlay.style.display =
            "none";

        saveButton.disabled =
            false;

    }



    /* =========================================
       CHECK LOGIN
    ========================================= */

    async function checkLogin() {

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getSession();


        if (error) {

            console.error(
                "Session error:",
                error
            );

            showMessage(
                "Unable to check your login session.",
                "error"
            );

            return false;
        }


        if (!data.session) {

            window.location.href =
                "login.html";

            return false;
        }


        return true;
    }



    /* =========================================
       IMAGE PREVIEW
    ========================================= */

    imageInput.addEventListener(
        "change",
        function () {

            hideMessage();


            const file =
                this.files[0];


            if (!file) {

                preview.style.display =
                    "none";

                return;
            }


            if (
                !ALLOWED_TYPES.includes(
                    file.type
                )
            ) {

                alert(
                    "Please choose a JPG, PNG or WEBP image."
                );

                this.value =
                    "";

                preview.style.display =
                    "none";

                return;
            }


            if (
                file.size >
                MAX_FILE_SIZE
            ) {

                alert(
                    "Image is too large. Please choose an image smaller than 10 MB."
                );

                this.value =
                    "";

                preview.style.display =
                    "none";

                return;
            }


            fileName.textContent =
                file.name;


            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    previewImage.src =
                        event.target.result;

                    preview.style.display =
                        "block";

                };


            reader.readAsDataURL(file);

        }
    );



    /* =========================================
       CREATE SAFE FILE NAME
    ========================================= */

    function createFileName(
        file
    ) {

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const randomPart =
            crypto.randomUUID();


        return (
            Date.now() +
            "-" +
            randomPart +
            "." +
            extension
        );
    }



    /* =========================================
       UPLOAD IMAGE
    ========================================= */

    async function uploadImage(
        file,
        userId
    ) {

        const fileName =
            createFileName(
                file
            );


        const filePath =
            userId +
            "/" +
            fileName;


        showLoading(
            "Uploading image",
            "Your artwork image is being uploaded to Artomb Studios."
        );


        const {
            error
        } =
            await supabaseClient
                .storage
                .from(BUCKET_NAME)
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:
                            "3600",

                        upsert:
                            false,

                        contentType:
                            file.type
                    }
                );


        if (error) {

            console.error(
                "Storage upload error:",
                error
            );

            throw new Error(
                "Image upload failed: " +
                error.message
            );
        }


        const {
            data
        } =
            supabaseClient
                .storage
                .from(BUCKET_NAME)
                .getPublicUrl(
                    filePath
                );


        if (
            !data ||
            !data.publicUrl
        ) {

            throw new Error(
                "Could not create public image URL."
            );
        }


        return {
            path:
                filePath,

            publicUrl:
                data.publicUrl
        };
    }



    /* =========================================
       DELETE UPLOADED IMAGE
       ========================================= */

    async function deleteUploadedImage(
        filePath
    ) {

        if (!filePath) {
            return;
        }


        const {
            error
        } =
            await supabaseClient
                .storage
                .from(BUCKET_NAME)
                .remove([
                    filePath
                ]);


        if (error) {

            console.error(
                "Could not remove uploaded image:",
                error
            );
        }
    }



    /* =========================================
       SAVE ARTWORK
    ========================================= */

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            hideMessage();


            /* -------------------------
               CHECK LOGIN
            ------------------------- */

            const {
                data:
                sessionData
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (
                !sessionData ||
                !sessionData.session
            ) {

                window.location.href =
                    "login.html";

                return;
            }


            const user =
                sessionData.session.user;



            /* -------------------------
               GET FORM DATA
            ------------------------- */

            const title =
                document
                    .getElementById(
                        "title"
                    )
                    .value
                    .trim();


            const medium =
                document
                    .getElementById(
                        "medium"
                    )
                    .value
                    .trim();


            const category =
                document
                    .getElementById(
                        "category"
                    )
                    .value;


            const description =
                document
                    .getElementById(
                        "description"
                    )
                    .value
                    .trim();


            const priceValue =
                document
                    .getElementById(
                        "price"
                    )
                    .value
                    .trim();


            const imageFile =
                imageInput.files[0];


            const status =
                document
                    .querySelector(
                        'input[name="status"]:checked'
                    )
                    .value;


            const isFeatured =
                status ===
                "published";



            /* -------------------------
               VALIDATION
            ------------------------- */

            if (!title) {

                showMessage(
                    "Please enter an artwork title.",
                    "error"
                );

                return;
            }


            if (!medium) {

                showMessage(
                    "Please enter the artwork medium.",
                    "error"
                );

                return;
            }


            if (!category) {

                showMessage(
                    "Please select an artwork category.",
                    "error"
                );

                return;
            }


            if (!imageFile) {

                showMessage(
                    "Please choose an artwork image.",
                    "error"
                );

                return;
            }


            if (
                !ALLOWED_TYPES.includes(
                    imageFile.type
                )
            ) {

                showMessage(
                    "Only JPG, PNG and WEBP images are allowed.",
                    "error"
                );

                return;
            }


            if (
                imageFile.size >
                MAX_FILE_SIZE
            ) {

                showMessage(
                    "Image must be smaller than 10 MB.",
                    "error"
                );

                return;
            }



            /* -------------------------
               DESCRIPTION
            ------------------------- */

            let finalDescription =
                description;


            if (medium) {

                finalDescription =
                    "Medium: " +
                    medium +
                    (
                        description
                        ?
                        "\n\n" +
                        description
                        :
                        ""
                    );
            }



            /* -------------------------
               PRICE
            ------------------------- */

            let price =
                null;


            if (priceValue !== "") {

                const parsedPrice =
                    Number(
                        priceValue
                    );


                if (
                    Number.isNaN(
                        parsedPrice
                    ) ||
                    parsedPrice < 0
                ) {

                    showMessage(
                        "Please enter a valid price.",
                        "error"
                    );

                    return;
                }


                price =
                    parsedPrice;
            }



            /* -------------------------
               START
            ------------------------- */

            let uploadedFilePath =
                null;


            try {

                showLoading(
                    "Preparing artwork",
                    "Connecting to your Artomb Studios collection."
                );



                /* =====================
                   UPLOAD IMAGE
                ===================== */

                const uploaded =
                    await uploadImage(
                        imageFile,
                        user.id
                    );


                uploadedFilePath =
                    uploaded.path;


                const imageUrl =
                    uploaded.publicUrl;



                /* =====================
                   SAVE DATABASE RECORD
                ===================== */

                showLoading(
                    "Saving artwork",
                    "Adding your artwork to the Artomb Studios collection."
                );


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("artworks")
                        .insert([
                            {
                                title:
                                    title,

                                description:
                                    finalDescription,

                                image_url:
                                    imageUrl,

                                price:
                                    price,

                                category:
                                    category,

                                featured:
                                    isFeatured
                            }
                        ])
                        .select()
                        .single();


                if (error) {

                    console.error(
                        "Database insert error:",
                        error
                    );


                    await deleteUploadedImage(
                        uploadedFilePath
                    );


                    throw new Error(
                        "Artwork database save failed: " +
                        error.message
                    );
                }



                /* =====================
                   SUCCESS
                ===================== */

                hideLoading();


                showMessage(
                    "Artwork saved successfully. Redirecting to your dashboard...",
                    "success"
                );


                form.reset();


                preview.style.display =
                    "none";


                previewImage.src =
                    "";


                fileName.textContent =
                    "";


                /*
                 * Give the success message
                 * a moment before returning.
                 */

                setTimeout(
                    function () {

                        window.location.href =
                            "dashboard.html";

                    },
                    1200
                );


            }
            catch (error) {

                console.error(
                    "Save artwork error:",
                    error
                );


                hideLoading();


                showMessage(
                    error.message ||
                    "Something went wrong while saving the artwork.",
                    "error"
                );

            }

        }
    );



    /* =========================================
       CANCEL
    ========================================= */

    cancelButton.addEventListener(
        "click",
        function () {

            window.location.href =
                "dashboard.html";

        }
    );



    /* =========================================
       START PAGE
    ========================================= */

    async function startPage() {

        const loggedIn =
            await checkLogin();


        if (!loggedIn) {
            return;
        }

    }


    startPage();

</script>

</body>
</html>
