<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f7f4ee"
    >

    <title>Add Artwork — Artomb Studios</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {
            --bg: #f7f4ee;
            --card: #fffdf9;
            --text: #171717;
            --muted: #77736c;
            --border: rgba(23, 23, 23, .12);
            --success-bg: #f3faf4;
            --success-border: #b8d2bd;
            --success-text: #38603e;
            --error-bg: #fff4f4;
            --error-border: #e1bebe;
            --error-text: #9b3d3d;
        }


        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        button,
        input,
        textarea,
        select {
            font: inherit;
        }


        button {
            cursor: pointer;
        }


        /* HEADER */

        .header {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5vw;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(247, 244, 238, .95);

            position: sticky;
            top: 0;
            z-index: 10;

            backdrop-filter: blur(12px);
        }


        .brand-main {
            display: block;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 21px;
            letter-spacing: 3px;
        }


        .brand-sub {
            display: block;

            margin-top: 4px;

            font-size: 7px;
            letter-spacing: 4px;

            opacity: .55;
        }


        .back-link {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;

            color: var(--muted);
        }


        /* MAIN */

        .page {
            width: min(1100px, 90%);

            margin: auto;

            padding:
                65px 0 90px;
        }


        .intro {
            margin-bottom: 40px;
        }


        .eyebrow {
            margin-bottom: 14px;

            color: var(--muted);

            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }


        h1 {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(42px, 7vw, 68px);

            font-weight: 400;

            line-height: .98;

            letter-spacing: -2px;
        }


        .intro p:last-child {
            max-width: 520px;

            margin-top: 18px;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.7;
        }


        /* FORM */

        .form-layout {
            display: grid;

            grid-template-columns:
                1.1fr .9fr;

            gap: 25px;
        }


        .card {
            background: var(--card);

            border:
                1px solid var(--border);

            padding: 28px;
        }


        .card-title {
            margin-bottom: 25px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 25px;
            font-weight: 400;
        }


        .field {
            margin-bottom: 22px;
        }


        label {
            display: block;

            margin-bottom: 9px;

            font-size: 10px;
            letter-spacing: 1.8px;
            text-transform: uppercase;

            color: #555;
        }


        input,
        textarea,
        select {
            width: 100%;

            border:
                1px solid #d8d4cc;

            background:
                #f7f4ee;

            color:
                var(--text);

            outline: none;

            padding: 14px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }


        input {
            height: 50px;
        }


        textarea {
            min-height: 135px;

            resize: vertical;

            line-height: 1.6;
        }


        select {
            height: 50px;
        }


        input:focus,
        textarea:focus,
        select:focus {

            border-color:
                #171717;

            box-shadow:
                0 0 0 3px
                rgba(23, 23, 23, .05);
        }


        /* IMAGE */

        .upload-box {
            min-height: 250px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            border:
                1px dashed #bcb8b0;

            background:
                #f7f4ee;

            padding: 25px;

            cursor: pointer;

            transition:
                border-color .2s ease,
                background .2s ease;
        }


        .upload-box:hover {
            border-color: #171717;

            background:
                #f3efe8;
        }


        .upload-icon {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid var(--border);

            margin-bottom: 18px;

            font-size: 23px;
        }


        .upload-box strong {
            display: block;

            margin-bottom: 7px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 20px;
            font-weight: 400;
        }


        .upload-box span {
            color:
                var(--muted);

            font-size: 11px;

            line-height: 1.6;
        }


        #artworkImage {
            display: none;
        }


        .preview {
            display: none;

            width: 100%;

            margin-top: 15px;
        }


        .preview img {
            display: block;

            width: 100%;
            max-height: 360px;

            object-fit: contain;

            background:
                #eeeae2;
        }


        /* STATUS */

        .status-options {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;
        }


        .status-option {
            position: relative;
        }


        .status-option input {
            position: absolute;

            opacity: 0;

            pointer-events: none;
        }


        .status-option label {
            height: 50px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin: 0;

            border:
                1px solid #d8d4cc;

            cursor: pointer;

            color:
                var(--muted);

            transition:
                background .2s ease,
                color .2s ease,
                border-color .2s ease;
        }


        .status-option input:checked + label {
            background:
                var(--text);

            color: white;

            border-color:
                var(--text);
        }


        /* MESSAGES */

        .message {
            display: none;

            margin-top: 20px;

            padding: 14px;

            border:
                1px solid var(--success-border);

            background:
                var(--success-bg);

            color:
                var(--success-text);

            font-size: 12px;

            line-height: 1.5;
        }


        .error-message {
            display: none;

            margin-top: 20px;

            padding: 14px;

            border:
                1px solid var(--error-border);

            background:
                var(--error-bg);

            color:
                var(--error-text);

            font-size: 12px;

            line-height: 1.5;
        }


        /* PROGRESS */

        .progress {
            display: none;

            margin-top: 15px;
        }


        .progress-text {
            margin-bottom: 8px;

            color:
                var(--muted);

            font-size: 11px;

            letter-spacing: 1px;

            text-transform: uppercase;
        }


        .progress-bar {
            width: 100%;

            height: 4px;

            background:
                #e2ded6;

            overflow: hidden;
        }


        .progress-fill {
            width: 0%;

            height: 100%;

            background:
                var(--text);

            transition:
                width .2s ease;
        }


        /* ACTIONS */

        .actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 25px;
        }


        .button {
            min-height: 50px;

            padding: 0 22px;

            border:
                1px solid var(--text);

            font-size: 10px;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            cursor: pointer;
        }


        .button-secondary {
            background:
                transparent;

            color:
                var(--text);
        }


        .button-primary {
            background:
                var(--text);

            color:
                white;
        }


        .button-primary:disabled {
            opacity: .5;

            cursor:
                not-allowed;
        }


        /* MOBILE */

        @media (max-width: 760px) {

            .header {
                height: 65px;
            }


            .page {
                padding-top: 50px;
            }


            .form-layout {
                grid-template-columns: 1fr;
            }


            .card {
                padding: 22px;
            }


            .actions {
                flex-direction:
                    column-reverse;
            }


            .button {
                width: 100%;
            }

        }


        @media (max-width: 420px) {

            .back-link {
                font-size: 9px;
            }


            h1 {
                font-size: 43px;
            }


            .status-options {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <a
        href="dashboard.html"
        aria-label="Back to dashboard">

        <span class="brand-main">
            ARTOMB
        </span>

        <span class="brand-sub">
            STUDIOS
        </span>

    </a>


    <a
        href="dashboard.html"
        class="back-link">

        ← Dashboard

    </a>

</header>



<main class="page">


    <section class="intro">

        <p class="eyebrow">
            Studio Collection
        </p>


        <h1>
            Add new<br>
            artwork.
        </h1>


        <p>
            Add the details of your artwork below.
            Your image will be uploaded to the
            Artomb Studios storage and the artwork
            will be saved to your collection.
        </p>

    </section>



    <form id="artworkForm">


        <div class="form-layout">


            <!-- ARTWORK DETAILS -->

            <section class="card">

                <h2 class="card-title">
                    Artwork Details
                </h2>


                <div class="field">

                    <label for="title">
                        Artwork Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="e.g. Silent Expression"
                        required
                    >

                </div>



                <div class="field">

                    <label for="medium">
                        Medium
                    </label>

                    <input
                        type="text"
                        id="medium"
                        placeholder="e.g. Graphite"
                        required
                    >

                </div>



                <div class="field">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        required>

                        <option value="">
                            Select category
                        </option>

                        <option value="portrait">
                            Portrait
                        </option>

                        <option value="charcoal">
                            Charcoal
                        </option>

                        <option value="graphite">
                            Graphite
                        </option>

                        <option value="couple">
                            Couple Portrait
                        </option>

                        <option value="pet">
                            Pet Portrait
                        </option>

                        <option value="custom">
                            Custom Artwork
                        </option>

                    </select>

                </div>



                <div class="field">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Tell the story behind this artwork..."
                    ></textarea>

                </div>



                <div class="field">

                    <label>
                        Publication Status
                    </label>


                    <div class="status-options">


                        <div class="status-option">

                            <input
                                type="radio"
                                id="published"
                                name="status"
                                value="published"
                                checked
                            >

                            <label for="published">
                                Published
                            </label>

                        </div>



                        <div class="status-option">

                            <input
                                type="radio"
                                id="draft"
                                name="status"
                                value="draft"
                            >

                            <label for="draft">
                                Draft
                            </label>

                        </div>


                    </div>

                </div>

            </section>



            <!-- IMAGE -->

            <section class="card">

                <h2 class="card-title">
                    Artwork Image
                </h2>


                <label
                    for="artworkImage"
                    class="upload-box">

                    <div class="upload-icon">
                        +
                    </div>


                    <strong>
                        Choose artwork
                    </strong>


                    <span>
                        JPG, PNG or WEBP<br>
                        Recommended: high resolution
                    </span>

                </label>



                <input
                    type="file"
                    id="artworkImage"
                    accept="image/jpeg,image/png,image/webp"
                    required
                >



                <div
                    class="preview"
                    id="preview">

                    <img
                        id="previewImage"
                        alt="Artwork preview"
                    >

                </div>



                <div
                    class="progress"
                    id="progress">

                    <div class="progress-text">
                        Uploading artwork...
                    </div>

                    <div class="progress-bar">

                        <div
                            class="progress-fill"
                            id="progressFill">
                        </div>

                    </div>

                </div>



                <div
                    class="message"
                    id="message">
                </div>



                <div
                    class="error-message"
                    id="errorMessage">
                </div>

            </section>

        </div>



        <!-- ACTIONS -->

        <div class="actions">

            <button
                type="button"
                class="button button-secondary"
                id="cancelButton">

                Cancel

            </button>


            <button
                type="submit"
                class="button button-primary"
                id="saveButton">

                Save Artwork

            </button>

        </div>


    </form>

</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


    /* ================================
       SUPABASE CONFIG
    ================================= */

    const SUPABASE_URL =
        "https://pdopupcnmvjzombukcpi.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_AbIdZemk0Mq7f1jNNM5zdQ_pYIzZNlU";


    const {
        createClient
    } = supabase;


    const supabaseClient =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );



    /* ================================
       ELEMENTS
    ================================= */

    const form =
        document.getElementById(
            "artworkForm"
        );


    const imageInput =
        document.getElementById(
            "artworkImage"
        );


    const preview =
        document.getElementById(
            "preview"
        );


    const previewImage =
        document.getElementById(
            "previewImage"
        );


    const message =
        document.getElementById(
            "message"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    const progress =
        document.getElementById(
            "progress"
        );


    const progressFill =
        document.getElementById(
            "progressFill"
        );


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    const cancelButton =
        document.getElementById(
            "cancelButton"
        );



    /* ================================
       MESSAGE FUNCTIONS
    ================================= */

    function showMessage(text) {

        message.textContent =
            text;

        message.style.display =
            "block";

        errorMessage.style.display =
            "none";
    }


    function showError(text) {

        errorMessage.textContent =
            text;

        errorMessage.style.display =
            "block";

        message.style.display =
            "none";

        console.error(text);
    }



    /* ================================
       LOGIN CHECK
    ================================= */

    async function checkLogin() {

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getSession();


        if (error) {

            showError(
                "Unable to check your login session."
            );

            return false;
        }


        if (!data.session) {

            window.location.href =
                "login.html";

            return false;
        }


        return true;
    }



    /* ================================
       IMAGE PREVIEW
    ================================= */

    imageInput.addEventListener(
        "change",
        function () {

            const file =
                this.files[0];


            if (!file) {
                return;
            }


            const allowedTypes = [
                "image/jpeg",
                "image/png",
                "image/webp"
            ];


            if (
                !allowedTypes.includes(
                    file.type
                )
            ) {

                alert(
                    "Please choose a JPG, PNG or WEBP image."
                );

                this.value = "";

                preview.style.display =
                    "none";

                return;
            }


            /*
             * 50 MB safety limit
             */

            if (
                file.size >
                50 * 1024 * 1024
            ) {

                alert(
                    "Image must be smaller than 50 MB."
                );

                this.value = "";

                preview.style.display =
                    "none";

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    previewImage.src =
                        event.target.result;

                    preview.style.display =
                        "block";

                };


            reader.readAsDataURL(file);

        }
    );



    /* ================================
       SAVE ARTWORK
    ================================= */

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            /*
             * Hide old messages
             */

            message.style.display =
                "none";

            errorMessage.style.display =
                "none";


            /*
             * Check login
             */

            const loggedIn =
                await checkLogin();


            if (!loggedIn) {
                return;
            }


            /*
             * Get form values
             */

            const title =
                document
                    .getElementById("title")
                    .value
                    .trim();


            const medium =
                document
                    .getElementById("medium")
                    .value
                    .trim();


            const category =
                document
                    .getElementById("category")
                    .value;


            const description =
                document
                    .getElementById("description")
                    .value
                    .trim();


            const status =
                document
                    .querySelector(
                        'input[name="status"]:checked'
                    )
                    .value;


            const file =
                imageInput.files[0];


            /*
             * Validation
             */

            if (!title) {

                showError(
                    "Please enter an artwork title."
                );

                return;
            }


            if (!medium) {

                showError(
                    "Please enter the artwork medium."
                );

                return;
            }


            if (!category) {

                showError(
                    "Please select a category."
                );

                return;
            }


            if (!file) {

                showError(
                    "Please choose an artwork image."
                );

                return;
            }


            /*
             * Disable button
             */

            saveButton.disabled =
                true;

            saveButton.textContent =
                "Uploading...";


            progress.style.display =
                "block";

            progressFill.style.width =
                "10%";


            try {


                /* ================================
                   GET CURRENT USER
                ================================= */

                const {
                    data: userData,
                    error: userError
                } =
                    await supabaseClient
                        .auth
                        .getUser();


                if (userError) {
                    throw userError;
                }


                if (!userData.user) {

                    window.location.href =
                        "login.html";

                    return;
                }


                const userId =
                    userData.user.id;


                progressFill.style.width =
                    "20%";



                /* ================================
                   CREATE UNIQUE FILE NAME
                ================================= */

                const fileExtension =
                    file.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                const safeTitle =
                    title
                        .toLowerCase()
                        .replace(
                            /[^a-z0-9]+/g,
                            "-"
                        )
                        .replace(
                            /^-+|-+$/g,
                            ""
                        );


                const fileName =
                    Date.now() +
                    "-" +
                    safeTitle +
                    "." +
                    fileExtension;


                const filePath =
                    userId +
                    "/" +
                    fileName;


                progressFill.style.width =
                    "30%";



                /* ================================
                   UPLOAD IMAGE
                ================================= */

                const {
                    error: uploadError
                } =
                    await supabaseClient
                        .storage
                        .from("artworks")
                        .upload(
                            filePath,
                            file,
                            {
                                cacheControl:
                                    "3600",

                                upsert:
                                    false,

                                contentType:
                                    file.type
                            }
                        );


                if (uploadError) {

                    throw new Error(
                        "Image upload failed: " +
                        uploadError.message
                    );
                }


                progressFill.style.width =
                    "65%";



                /* ================================
                   GET PUBLIC IMAGE URL
                ================================= */

                const {
                    data: publicUrlData
                } =
                    supabaseClient
                        .storage
                        .from("artworks")
                        .getPublicUrl(
                            filePath
                        );


                const imageUrl =
                    publicUrlData.publicUrl;


                if (!imageUrl) {

                    throw new Error(
                        "Could not create image URL."
                    );
                }


                progressFill.style.width =
                    "80%";



                /* ================================
                   SAVE ARTWORK TO DATABASE
                ================================= */

                const {
                    data: artworkData,
                    error: insertError
                } =
                    await supabaseClient
                        .from("artworks")
                        .insert([
                            {
                                title:
                                    title,

                                medium:
                                    medium,

                                category:
                                    category,

                                description:
                                    description,

                                image_url:
                                    imageUrl,

                                featured:
                                    status ===
                                    "published"
                            }
                        ])
                        .select()
                        .single();


                if (insertError) {

                    /*
                     * Remove uploaded image
                     * if database insert fails.
                     */

                    await supabaseClient
                        .storage
                        .from("artworks")
                        .remove([
                            filePath
                        ]);


                    throw new Error(
                        "Artwork database save failed: " +
                        insertError.message
                    );
                }


                progressFill.style.width =
                    "100%";


                saveButton.textContent =
                    "Saved ✓";


                showMessage(
                    "Artwork added successfully. Redirecting to dashboard..."
                );


                /*
                 * Redirect after successful save
                 */

                setTimeout(
                    function () {

                        window.location.href =
                            "dashboard.html";

                    },
                    1200
                );


            } catch (error) {

                console.error(
                    "SAVE ERROR:",
                    error
                );


                progress.style.display =
                    "none";


                saveButton.disabled =
                    false;


                saveButton.textContent =
                    "Save Artwork";


                showError(
                    error.message ||
                    "Something went wrong while saving the artwork."
                );

            }

        }
    );



    /* ================================
       CANCEL
    ================================= */

    cancelButton.addEventListener(
        "click",
        function () {

            window.location.href =
                "dashboard.html";

        }
    );



    /* ================================
       START
    ================================= */

    async function startPage() {

        const loggedIn =
            await checkLogin();


        if (!loggedIn) {
            return;
        }

    }


    startPage();

</script>


</body>
</html>
