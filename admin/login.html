<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#f7f4ee"
>

<title>Admin Login — Artomb Studios</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f7f4ee;
        color: #171717;
        font-family: Arial, Helvetica, sans-serif;
    }

    .login-page {
        width: 100%;
        max-width: 430px;
    }

    .brand {
        text-align: center;
        margin-bottom: 34px;
    }

    .brand-main {
        display: block;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 30px;
        letter-spacing: 5px;
    }

    .brand-sub {
        display: block;
        margin-top: 4px;
        font-size: 9px;
        letter-spacing: 5px;
        opacity: .55;
    }

    .login-card {
        background: #fffdf9;
        border: 1px solid rgba(23, 23, 23, .12);
        padding: 34px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .07);
    }

    .eyebrow {
        font-size: 10px;
        letter-spacing: 3px;
        text-transform: uppercase;
        opacity: .55;
        margin-bottom: 14px;
    }

    h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 36px;
        font-weight: 400;
        line-height: 1.05;
        margin-bottom: 12px;
    }

    .description {
        color: #666;
        font-size: 14px;
        line-height: 1.7;
        margin-bottom: 30px;
    }

    .field {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-size: 10px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        color: #555;
    }

    input {
        width: 100%;
        height: 52px;
        padding: 0 15px;
        border: 1px solid #d8d4cc;
        background: #f7f4ee;
        color: #171717;
        outline: none;
        font-size: 15px;
        transition:
            border-color .25s ease,
            box-shadow .25s ease;
    }

    input:focus {
        border-color: #171717;
        box-shadow: 0 0 0 3px rgba(23, 23, 23, .06);
    }

    .login-button {
        width: 100%;
        height: 54px;
        margin-top: 8px;
        border: 0;
        background: #171717;
        color: #fff;
        cursor: pointer;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        transition:
            transform .25s ease,
            background .25s ease;
    }

    .login-button:active {
        transform: scale(.98);
    }

    .login-button:disabled {
        opacity: .6;
        cursor: not-allowed;
    }

    .error {
        display: none;
        margin-top: 16px;
        padding: 12px 14px;
        border: 1px solid #e1bebe;
        background: #fff4f4;
        color: #9b3d3d;
        font-size: 12px;
        line-height: 1.5;
    }

    .back-link {
        display: block;
        margin-top: 24px;
        text-align: center;
        color: #555;
        text-decoration: none;
        font-size: 11px;
        letter-spacing: 1px;
    }

    .back-link:hover {
        color: #111;
    }

    @media (max-width: 480px) {

        body {
            padding: 18px;
        }

        .login-card {
            padding: 26px 20px;
        }

        h1 {
            font-size: 32px;
        }
    }
</style>

</head><body><main class="login-page">

    <div class="brand">
        <span class="brand-main">ARTOMB</span>
        <span class="brand-sub">STUDIOS</span>
    </div>

    <section class="login-card">

        <p class="eyebrow">
            Private Area
        </p>

        <h1>
            Studio Admin
        </h1>

        <p class="description">
            Sign in to manage artwork, gallery content
            and studio updates.
        </p>

        <form id="loginForm">

            <div class="field">

                <label for="email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>

            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton">

                Enter Studio

            </button>

        </form>

        <div
            class="error"
            id="loginError">

            Incorrect email or password. Please try again.

        </div>

    </section>

    <a
        href="../index.html"
        class="back-link">

        ← Back to Artomb Studios

    </a>

</main>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    /*
     * ==========================================
     * ARTOMB STUDIOS — SUPABASE CONFIGURATION
     * ==========================================
     */

    const SUPABASE_URL =
        "https://adopucpnmvjzombuckpi.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_AbIdZemk0Mq7f1jNNM5zdQ_pYIzZNlU";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /*
     * ==========================================
     * LOGIN
     * ==========================================
     */

    const loginForm =
        document.getElementById("loginForm");

    const loginError =
        document.getElementById("loginError");

    const loginButton =
        document.getElementById("loginButton");


    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            loginError.style.display = "none";

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            loginButton.disabled = true;
            loginButton.textContent = "Signing In...";


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .signInWithPassword({
                            email: email,
                            password: password
                        });


                if (error) {
                    throw error;
                }


                if (data.session) {

                    window.location.href =
                        "dashboard.html";

                } else {

                    throw new Error(
                        "Login session could not be created."
                    );

                }

            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                loginError.textContent =
                    "Incorrect email or password. Please try again.";

                loginError.style.display =
                    "block";

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Enter Studio";
            }

        }
    );

</script>

</body>
</html>
